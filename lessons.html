<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروس الشيخ — عِلْمٌ يُنْتَفَعُ بِهِ</title>
    <meta name="description" content="دروس الشيخ — منصة عِلْمٌ يُنْتَفَعُ بِهِ">
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="دروس الشيخ — عِلْمٌ يُنْتَفَعُ بِهِ" />
    <meta property="og:description" content="دروس إسلامية من علماء موثوقين — آيات وأحاديث وفوائد" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />
    <meta name="twitter:card" content="summary" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════
       Lessons Page — Self-contained
       Dark + Gold theme (same as browse)
    ═══════════════════════════════ */
        :root {
            --gold: #EDBA26;
            --gold-dim: rgba(237, 186, 38, .15);
            --gold-border: rgba(237, 186, 38, .25);
            --bg-1: #0a0a1a;
            --bg-2: #1a1a2e;
            --card-bg: rgba(255, 255, 255, .04);
            --card-hover: rgba(255, 255, 255, .08);
            --text-1: #f0f0f0;
            --text-2: rgba(255, 255, 255, .6);
            --text-3: rgba(255, 255, 255, .4);
            --radius: 16px;
            --transition: .3s cubic-bezier(.23, 1, .32, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text-1);
            min-height: 100vh;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══ Scrollbar ═══ */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gold-border);
            border-radius: 3px;
        }

        /* ═══ Breadcrumb ═══ */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: .4rem;
            padding: .6rem 1.2rem;
            font-size: .82rem;
            color: var(--text-3);
            max-width: 600px;
            margin: 0 auto;
        }

        .breadcrumb a {
            color: var(--gold);
            text-decoration: none;
            opacity: .8;
            transition: opacity .2s;
        }

        .breadcrumb a:hover {
            opacity: 1;
        }

        .breadcrumb .sep {
            opacity: .4;
        }

        .breadcrumb .current {
            color: var(--text-2);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ═══ Page Header ═══ */
        .page-header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: 1rem 1.25rem;
            background: rgba(10, 10, 26, .92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--gold-border);
        }

        .page-header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), #F5D245);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex: 1;
        }

        .page-header .lessons-count {
            font-size: .85rem;
            color: var(--text-2);
            background: var(--gold-dim);
            padding: .25rem .75rem;
            border-radius: 20px;
            white-space: nowrap;
        }

        .btn-back {
            background: var(--gold-dim);
            border: none;
            color: var(--gold);
            font-size: 1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition);
        }

        .btn-back:hover {
            background: rgba(237, 186, 38, .25);
        }

        /* ═══ Container ═══ */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* ═══ Search ═══ */
        .search-wrap {
            max-width: 500px;
            margin: 1rem auto 1.5rem;
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            padding: .85rem 1rem .85rem 2.8rem;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 12px;
            color: var(--text-1);
            font-size: .95rem;
            font-family: inherit;
            outline: none;
            transition: border var(--transition);
        }

        .search-wrap input:focus {
            border-color: var(--gold-border);
        }

        .search-wrap input::placeholder {
            color: var(--text-3);
        }

        .search-wrap .icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-3);
            font-size: .9rem;
        }

        /* ═══ Lessons List ═══ */
        .lessons-wrap {
            padding-bottom: 2rem;
        }

        .lesson-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: .75rem;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: all var(--transition);
            animation: fadeIn .35s ease;
        }

        .lesson-card:hover {
            border-color: var(--gold-border);
            transform: translateX(-4px);
            background: var(--card-hover);
        }

        .lesson-num {
            min-width: 32px;
            height: 32px;
            background: var(--gold-dim);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .85rem;
            font-weight: 700;
            color: var(--gold);
            flex-shrink: 0;
        }

        .lesson-info {
            flex: 1;
            min-width: 0;
        }

        .lesson-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-1);
            margin-bottom: .25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lesson-meta {
            display: flex;
            gap: .75rem;
            font-size: .78rem;
            color: var(--text-3);
        }

        .lesson-meta i {
            margin-left: .25rem;
        }

        .lesson-arrow {
            color: var(--text-3);
            font-size: .8rem;
            flex-shrink: 0;
        }

        /* ═══ Empty / Error / Loading ═══ */
        .state-msg {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-2);
        }

        .state-msg i {
            font-size: 3rem;
            color: var(--gold);
            opacity: .35;
            display: block;
            margin-bottom: 1rem;
        }

        .state-msg p {
            font-size: 1.05rem;
        }

        .state-msg .retry-btn {
            margin-top: 1rem;
            padding: .6rem 1.5rem;
            background: var(--gold-dim);
            border: 1px solid var(--gold-border);
            color: var(--gold);
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: .9rem;
            transition: background var(--transition);
        }

        .state-msg .retry-btn:hover {
            background: rgba(237, 186, 38, .25);
        }

        .spinner {
            width: 44px;
            height: 44px;
            margin: 0 auto 1rem;
            border: 4px solid var(--gold-dim);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ═══ Skeleton Shimmer ═══ */
        .skeleton-lesson {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.2rem;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: var(--radius);
            margin-bottom: .75rem;
        }

        .skeleton-num {
            min-width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, .06);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .skeleton-lines {
            flex: 1;
        }

        .skeleton-line {
            height: 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, .06);
            margin-bottom: .5rem;
            position: relative;
            overflow: hidden;
        }

        .skeleton-line.w80 {
            width: 80%;
        }

        .skeleton-line.w50 {
            width: 50%;
        }

        .skeleton-num::after,
        .skeleton-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .08), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% {
                left: 100%;
            }
        }

        /* ═══ Bottom Nav ═══ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 26, .95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, .06);
            display: flex;
            justify-content: space-around;
            padding: .6rem 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .2rem;
            text-decoration: none;
            color: var(--text-3);
            font-size: .7rem;
            padding: .4rem .8rem;
            border-radius: 8px;
            transition: color var(--transition);
        }

        .nav-item i {
            font-size: 1.3rem;
        }

        .nav-item.active {
            color: var(--gold);
        }

        .nav-item:hover:not(.disabled) {
            color: var(--gold);
        }

        .nav-item.disabled {
            opacity: .3;
            pointer-events: none;
        }

        .nav-item .badge-soon {
            position: absolute;
            top: -2px;
            right: -4px;
            background: rgba(237, 186, 38, .25);
            color: var(--gold);
            font-size: .5rem;
            padding: .1rem .35rem;
            border-radius: 4px;
        }

        /* ═══ Responsive ═══ */
        @media (max-width: 600px) {
            .page-header h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="breadcrumb">
        <a href="/"><i class="fas fa-home" style="font-size:.75rem;"></i> الرئيسية</a>
        <span class="sep">›</span>
        <a href="/browse">المشايخ</a>
        <span class="sep">›</span>
        <span class="current" id="breadcrumbSheikh">دروس الشيخ</span>
    </div>

    <!-- ══════════════ PAGE HEADER ══════════════ -->
    <div class="page-header">
        <button class="btn-back" id="btnBack" aria-label="رجوع">
            <i class="fas fa-arrow-right"></i>
        </button>
        <h1 id="pageTitle">📚 دروس الشيخ</h1>
        <span class="lessons-count" id="lessonsCount" style="display:none;"></span>
    </div>

    <!-- ══════════════ CONTENT ══════════════ -->
    <div class="container">
        <div class="search-wrap">
            <i class="fas fa-search icon"></i>
            <input type="text" id="searchLessons" placeholder="ابحث في الدروس...">
        </div>

        <div id="lessonsList" class="lessons-wrap">
            <!-- تُملأ بالـ JS -->
        </div>
    </div>

    <!-- ══════════════ BOTTOM NAV (ديناميكي من API) ══════════════ -->
    <nav class="bottom-nav" id="bottomNav" aria-label="التنقل الرئيسي">
        <!-- Fallback ثابت — يتبدل بالديناميكي من JS -->
        <a href="/" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="/browse" class="nav-item"><i class="fas fa-user-tie"></i><span>المشايخ</span></a>
    </nav>

    <script>
        // Bottom Nav ديناميكي (مثل index.html)
        (async function loadDynamicNav() {
            try {
                const res = await fetch('/api/public/nav');
                const items = await res.json();
                const nav = document.getElementById('bottomNav');
                if (!items.length) return;

                nav.innerHTML = '';
                const currentPath = location.pathname;

                items.filter(i => i.type !== 'center').forEach(item => {
                    const a = document.createElement('a');
                    a.href = item.href;
                    a.className = 'nav-item';
                    if (item.target === '_blank') a.target = '_blank';

                    // Active: المشايخ يكون active في صفحة الدروس
                    if (item.href === '/browse') {
                        a.classList.add('active');
                    }

                    if (item.disabled || item.href === 'javascript:void(0)') {
                        a.classList.add('disabled');
                        a.style.position = 'relative';
                    }

                    a.innerHTML = `<i class="${item.icon}"></i><span>${item.label}</span>`;

                    if (item.badge) {
                        a.innerHTML += `<span class="badge-soon">${item.badge}</span>`;
                    }

                    nav.appendChild(a);
                });
            } catch (err) {
                console.log('Nav API fallback (static nav visible)');
            }
        })();
    </script>

    <!-- ══════════════ JAVASCRIPT ══════════════ -->
    <script>
        // ═══════════ State ═══════════
        let allLessons = [];
        const params = new URLSearchParams(location.search);
        const sheikhId = params.get('sheikh');
        const sheikhNameFromUrl = params.get('name') ? decodeURIComponent(params.get('name')) : null;

        // Breadcrumb: update sheikh name immediately
        if (sheikhNameFromUrl) {
            document.getElementById('breadcrumbSheikh').textContent = sheikhNameFromUrl;
        }

        // 💬 Chat Widget: ربط sheikhId (Phase 9C-1)
        const chatWidget = document.getElementById('chat-widget');
        if (chatWidget && sheikhId) chatWidget.dataset.sheikhId = sheikhId;

        // ═══════════ Progress Manager (same API as website.html) ═══════════
        const ProgressManager = {
            KEY: 'read_lessons',
            _get() {
                try { return JSON.parse(localStorage.getItem(this.KEY) || '{}'); }
                catch { return {}; }
            },
            isRead(lessonId) {
                return !!this._get()[lessonId];
            }
        };

        // ═══════════ Back Button (Claude fix: fallback to /browse) ═══════════
        document.getElementById('btnBack').addEventListener('click', () => {
            if (document.referrer && window.history.length > 1) {
                history.back();
            } else {
                location.href = '/browse';
            }
        });

        // ═══════════ Load Lessons ═══════════
        async function loadLessons() {
            if (!sheikhId) {
                document.getElementById('pageTitle').textContent = '⚠️ لم يتم تحديد شيخ';
                document.getElementById('lessonsList').innerHTML = `
                    <div class="state-msg">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>لم يتم تحديد شيخ</p>
                        <a href="/browse" class="retry-btn"><i class="fas fa-arrow-right"></i> رجوع للمشايخ</a>
                    </div>`;
                return;
            }

            // Set title immediately from URL param if available
            if (sheikhNameFromUrl) {
                document.getElementById('pageTitle').textContent = `📚 دروس ${sheikhNameFromUrl}`;
                document.title = `دروس ${sheikhNameFromUrl} — عِلْمٌ يُنْتَفَعُ بِهِ`;
            }

            const list = document.getElementById('lessonsList');
            // Skeleton shimmer بدل spinner
            list.innerHTML = Array.from({ length: 5 }, () => `
                <div class="skeleton-lesson">
                    <div class="skeleton-num"></div>
                    <div class="skeleton-lines">
                        <div class="skeleton-line w80"></div>
                        <div class="skeleton-line w50"></div>
                    </div>
                </div>
            `).join('');

            try {
                // Claude fix: limit=500 بدل 100 عشان ميفوتش دروس
                const res = await fetch(`/api/public/lessons?sheikh=${sheikhId}&limit=500`);
                if (!res.ok) throw new Error('HTTP ' + res.status);

                const data = await res.json();
                allLessons = data.lessons || [];

                // Update sheikh name from first lesson if not in URL
                if (!sheikhNameFromUrl && allLessons.length > 0 && allLessons[0].sheikhName) {
                    const name = allLessons[0].sheikhName;
                    document.getElementById('pageTitle').textContent = `📚 دروس ${name}`;
                    document.title = `دروس ${name} — عِلْمٌ يُنْتَفَعُ بِهِ`;
                }

                // Show count badge
                const countEl = document.getElementById('lessonsCount');
                countEl.textContent = `${allLessons.length} درس`;
                countEl.style.display = 'inline';

                renderLessons(allLessons);
            } catch (err) {
                console.error('❌ Load lessons:', err);
                list.innerHTML = `
                    <div class="state-msg">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>خطأ في تحميل الدروس</p>
                        <button class="retry-btn" onclick="loadLessons()"><i class="fas fa-redo"></i> إعادة المحاولة</button>
                    </div>`;
            }
        }

        // ═══════════ Render Lessons ═══════════
        function renderLessons(lessons) {
            const list = document.getElementById('lessonsList');

            if (!lessons.length) {
                list.innerHTML = `
                    <div class="state-msg">
                        <i class="fas fa-book-open"></i>
                        <p>لا توجد دروس حالياً لهذا الشيخ</p>
                        <p style="font-size:.85rem;color:var(--text-3);margin-top:.5rem;">سيتم إضافة دروس قريباً إن شاء الله</p>
                    </div>`;
                return;
            }

            list.innerHTML = lessons.map((l, i) => {
                const isRead = ProgressManager.isRead(l._id);
                return `
                <div class="lesson-card" onclick="location.href='/website?lesson=${l._id}'">
                    <div class="lesson-num">${isRead ? '<i class="fas fa-check" style="color:#10b981;font-size:.8rem;"></i>' : (i + 1)}</div>
                    <div class="lesson-info">
                        <div class="lesson-title">${l.title}${isRead ? ' <span style="color:#10b981;font-size:.75rem;">✅</span>' : ''}</div>
                        <div class="lesson-meta">
                            ${l.categoryName ? `<span><i class="fas fa-folder"></i>${l.categoryName}</span>` : ''}
                        </div>
                    </div>
                    <i class="fas fa-chevron-left lesson-arrow"></i>
                </div>
            `;
            }).join('');
        }

        // ═══════════ Search Lessons ═══════════
        document.getElementById('searchLessons').addEventListener('input', function () {
            const q = this.value.trim().toLowerCase();
            if (!q) return renderLessons(allLessons);
            renderLessons(allLessons.filter(l => l.title.toLowerCase().includes(q)));
        });

        // ═══════════ Init ═══════════
        document.addEventListener('DOMContentLoaded', loadLessons);
    </script>

    <!-- 💬 Chat Widget (Phase 9C-1: Sheikh Mode) -->
    <div id="chat-widget"></div>
    <script src="/public/chat-widget.js"></script>
</body>

</html>
