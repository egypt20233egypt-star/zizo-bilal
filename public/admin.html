<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الأدمن - زيزو وبلال</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #D4AF37;
      --dark: #1a1a2e;
      --darker: #16213e;
      --burgundy: #722F37;
      --text: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, var(--darker), var(--dark));
      padding: 20px;
      border-bottom: 2px solid var(--gold);
      margin-bottom: 30px;
    }

    header h1 {
      color: var(--gold);
      font-size: 1.8rem;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 12px 24px;
      background: var(--darker);
      border: 1px solid var(--gold);
      color: var(--gold);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .tab:hover,
    .tab.active {
      background: var(--gold);
      color: var(--dark);
    }

    .panel {
      display: none;
      background: var(--darker);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .panel.active {
      display: block;
    }

    .panel h2 {
      color: var(--gold);
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--gold);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--gold);
      border-radius: 8px;
      background: var(--dark);
      color: var(--text);
      font-family: inherit;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--dark);
    }

    .btn-primary:hover {
      background: #e6c547;
    }

    .btn-danger {
      background: var(--burgundy);
      color: white;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: var(--dark);
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid rgba(212, 175, 55, 0.1);
    }

    .list-item span {
      font-size: 1.1rem;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-right: 10px;
    }

    .badge-success {
      background: #2ecc71;
      color: white;
    }

    .badge-warning {
      background: #f39c12;
      color: white;
    }

    .badge-draft {
      background: #95a5a6;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, var(--darker), var(--dark));
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid var(--gold);
    }

    .stat-card h3 {
      font-size: 2.5rem;
      color: var(--gold);
    }

    .stat-card p {
      color: #999;
    }

    #loginForm {
      max-width: 400px;
      margin: 100px auto;
      padding: 40px;
      background: var(--darker);
      border-radius: 12px;
      border: 1px solid var(--gold);
    }

    #loginForm h2 {
      text-align: center;
      color: var(--gold);
      margin-bottom: 30px;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .message-success {
      background: rgba(46, 204, 113, 0.2);
      border: 1px solid #2ecc71;
    }

    .message-error {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
    }
  </style>
</head>

<body>

  <!-- Login Form -->
  <div id="loginForm">
    <h2>🔐 تسجيل الدخول</h2>
    <div class="form-group">
      <label>اسم المستخدم</label>
      <input type="text" id="username" value="admin">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" value="admin123">
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="login()">دخول</button>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="hidden">
    <header>
      <div class="container">
        <h1>📊 لوحة الأدمن - منصة زيزو وبلال</h1>
      </div>
    </header>

    <div class="container">
      <div class="stats">
        <div class="stat-card">
          <h3 id="sectionsCount">0</h3>
          <p>الأقسام</p>
        </div>
        <div class="stat-card">
          <h3 id="sheikhsCount">0</h3>
          <p>المشايخ</p>
        </div>
        <div class="stat-card">
          <h3 id="lessonsCount">0</h3>
          <p>الدروس</p>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="showTab('sections')">📚 الأقسام</button>
        <button class="tab" onclick="showTab('sheikhs')">👤 المشايخ</button>
        <button class="tab" onclick="showTab('lessons')">📖 الدروس</button>
        <button class="tab" onclick="showTab('addLesson')">➕ إضافة درس</button>
      </div>

      <!-- Sections Panel -->
      <div id="sections" class="panel active">
        <h2>إدارة الأقسام</h2>
        <button class="btn btn-primary" onclick="seedSections()" style="margin-bottom:20px">🌱 إضافة الأقسام
          الافتراضية</button>
        <div id="sectionsList"></div>
      </div>

      <!-- Sheikhs Panel -->
      <div id="sheikhs" class="panel">
        <h2>إدارة المشايخ</h2>
        <div class="form-group">
          <label>اسم الشيخ</label>
          <input type="text" id="sheikhName" placeholder="مثال: الشيخ الشعراوي">
        </div>
        <button class="btn btn-primary" onclick="addSheikh()">➕ إضافة شيخ</button>
        <hr style="margin: 20px 0; border-color: var(--gold)">
        <div id="sheikhsList"></div>
      </div>

      <!-- Lessons Panel -->
      <div id="lessons" class="panel">
        <h2>الدروس المضافة</h2>
        <div id="lessonsList"></div>
      </div>

      <!-- Add Lesson Panel -->
      <div id="addLesson" class="panel">
        <h2>إضافة درس جديد</h2>
        <div class="form-group">
          <label>عنوان الدرس</label>
          <input type="text" id="lessonTitle" placeholder="مثال: درس عن مصعب بن عمير">
        </div>
        <div class="form-group">
          <label>الشيخ</label>
          <select id="lessonSheikh"></select>
        </div>
        <div class="form-group">
          <label>المحتوى الخام (التفريغ)</label>
          <textarea id="lessonContent" placeholder="ألصق هنا تفريغ الدرس..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="addLesson()">💾 حفظ الدرس</button>
      </div>
    </div>
  </div>

  <script>
    const API = '';
    let token = localStorage.getItem('token');

    // Check if logged in
    if (token) {
      showAdmin();
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.token) {
          localStorage.setItem('token', data.token);
          token = data.token;
          showAdmin();
        } else {
          alert('خطأ في تسجيل الدخول');
        }
      } catch (err) {
        alert('خطأ في الاتصال بالسيرفر');
      }
    }

    function showAdmin() {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      loadData();
    }

    function showTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    async function loadData() {
      await loadSections();
      await loadSheikhs();
      await loadLessons();
    }

    async function loadSections() {
      const res = await fetch(`${API}/api/sections`);
      const sections = await res.json();
      document.getElementById('sectionsCount').textContent = sections.length;

      const list = document.getElementById('sectionsList');
      list.innerHTML = sections.map(s => `
        <div class="list-item">
          <span>${s.icon} ${s.nameAr}</span>
          <span class="badge ${s.isOptional ? 'badge-warning' : 'badge-success'}">
            ${s.isOptional ? 'اختياري' : 'أساسي'}
          </span>
        </div>
      `).join('');
    }

    async function seedSections() {
      await fetch(`${API}/api/sections/seed`, { method: 'POST' });
      await loadSections();
      alert('تم إضافة الأقسام الافتراضية ✅');
    }

    async function loadSheikhs() {
      const res = await fetch(`${API}/api/sheikhs`);
      const sheikhs = await res.json();
      document.getElementById('sheikhsCount').textContent = sheikhs.length;

      const list = document.getElementById('sheikhsList');
      list.innerHTML = sheikhs.map(s => `
        <div class="list-item">
          <span>👤 ${s.name}</span>
          <button class="btn btn-danger" onclick="deleteSheikh('${s._id}')">حذف</button>
        </div>
      `).join('');

      // Update sheikh select
      const select = document.getElementById('lessonSheikh');
      select.innerHTML = '<option value="">اختر الشيخ</option>' +
        sheikhs.map(s => `<option value="${s._id}">${s.name}</option>`).join('');
    }

    async function addSheikh() {
      const name = document.getElementById('sheikhName').value;
      if (!name) return alert('أدخل اسم الشيخ');

      await fetch(`${API}/api/sheikhs`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      document.getElementById('sheikhName').value = '';
      await loadSheikhs();
    }

    async function deleteSheikh(id) {
      if (!confirm('هل تريد حذف هذا الشيخ؟')) return;
      await fetch(`${API}/api/sheikhs/${id}`, { method: 'DELETE' });
      await loadSheikhs();
    }

    async function loadLessons() {
      const res = await fetch(`${API}/api/lessons`);
      const lessons = await res.json();
      document.getElementById('lessonsCount').textContent = lessons.length;

      const list = document.getElementById('lessonsList');
      list.innerHTML = lessons.length ? lessons.map(l => `
        <div class="list-item">
          <div>
            <span>📖 ${l.title}</span>
            <span class="badge badge-${l.status === 'published' ? 'success' : 'draft'}">
              ${l.status === 'published' ? 'منشور' : 'مسودة'}
            </span>
          </div>
          <div class="actions">
            <button class="btn btn-primary" onclick="publishLesson('${l._id}')">نشر</button>
            <button class="btn btn-danger" onclick="deleteLesson('${l._id}')">حذف</button>
          </div>
        </div>
      `).join('') : '<p>لا توجد دروس بعد</p>';
    }

    async function addLesson() {
      const title = document.getElementById('lessonTitle').value;
      const sheikh = document.getElementById('lessonSheikh').value;
      const rawContent = document.getElementById('lessonContent').value;

      if (!title || !sheikh) return alert('أدخل البيانات المطلوبة');

      await fetch(`${API}/api/lessons`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, sheikh, rawContent })
      });

      document.getElementById('lessonTitle').value = '';
      document.getElementById('lessonContent').value = '';
      await loadLessons();
      alert('تم حفظ الدرس ✅');
    }

    async function publishLesson(id) {
      await fetch(`${API}/api/lessons/${id}/publish`, { method: 'PUT' });
      await loadLessons();
    }

    async function deleteLesson(id) {
      if (!confirm('هل تريد حذف هذا الدرس؟')) return;
      await fetch(`${API}/api/lessons/${id}`, { method: 'DELETE' });
      await loadLessons();
    }
  </script>
</body>

</html>
