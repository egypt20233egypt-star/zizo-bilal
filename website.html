    <!-- Floating Buttons (v3 Style) -->

            <input type="text" id="searchInput" placeholder="ابحث في كل الدروس..." autocomplete="off">

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============ Configuration ============
        const API_URL = window.location.origin + '/api/public/lessons';

        let currentLesson = null;
        let allLessons = [];

        // ============ Progress Manager (localStorage) ============
        const ProgressManager = {
            KEY: 'read_lessons',
            _get() {
                try { return JSON.parse(localStorage.getItem(this.KEY) || '{}'); }
                catch { return {}; }
            },
            markAsRead(lessonId, sheikhId) {
                if (!lessonId) return;
                const data = this._get();
                if (!data[lessonId]) {
                    data[lessonId] = { sheikhId: sheikhId || '', readAt: Date.now() };
                    try { localStorage.setItem(this.KEY, JSON.stringify(data)); }
                    catch (e) { console.warn('localStorage full'); }
                }
            },
            isRead(lessonId) {
                return !!this._get()[lessonId];
            },
            getReadCount(sheikhId) {
                const data = this._get();
                if (!sheikhId) return Object.keys(data).length;
                return Object.values(data).filter(v => v.sheikhId === sheikhId).length;
            },
            getTotalRead() {
                return Object.keys(this._get()).length;
            }
        };

        // ============ Breadcrumb Update ============
        function updateBreadcrumb(lesson) {
            const bar = document.getElementById('breadcrumbBar');
            if (!bar || !lesson) return;
            bar.style.display = 'flex';

            const sheikhEl = document.getElementById('breadcrumbSheikh');
            const lessonEl = document.getElementById('breadcrumbLesson');

            if (sheikhEl && lesson.sheikhName) {
                sheikhEl.textContent = lesson.sheikhName;
                sheikhEl.href = `/lessons?sheikh=${lesson.sheikhId || ''}&name=${encodeURIComponent(lesson.sheikhName)}`;
            }
            if (lessonEl && lesson.title) {
                lessonEl.textContent = lesson.title;
            }
        }

        // ============ Initialize ============
        document.addEventListener('DOMContentLoaded', async function () {
            // قراءة الـ query params من الـ URL
            const params = new URLSearchParams(window.location.search);
            const lessonId = params.get('lesson');
            const sheikhId = params.get('sheikh');
            const categoryId = params.get('category');

            if (lessonId) {
                // عرض درس واحد مباشرة
                await loadSingleLesson(lessonId);
            } else {
                // عرض قائمة دروس (مع فلترة اختيارية)
                const filters = {};
                if (sheikhId) filters.sheikh = sheikhId;
                if (categoryId) filters.category = categoryId;
                await loadLessons(filters);
            }

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 800);

            initScrollTop();
            initSearch();
        });

        // ============ Load Lessons from Public API ============
        async function loadLessons(filters = {}) {
            try {
                // بناء الـ query string من الفلاتر
                const params = new URLSearchParams(filters);
                const url = params.toString() ? `${API_URL}?${params}` : API_URL;

                const response = await fetch(url);
                const data = await response.json();

                // الـ API الجديد بيرجع { lessons: [...], pagination: {...} }
                const lessons = data.lessons || data;
                allLessons = lessons;

                if (lessons.length === 0) {
                    showEmptyState();
                } else {
                    renderLessonsGrid(lessons);
                    // Auto-select first lesson (most recent)
                    selectLessonByIndex(0);
                    // 🧪 Auto-Discovery Report بعد تحميل كل الدروس
                    setTimeout(() => SectionResolver.printDiscoveryReport(), 500);
                }
            } catch (error) {
                console.error('Error loading lessons:', error);
                showErrorState();
            }
        }

        // ============ Load Single Lesson by ID ============
        async function loadSingleLesson(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                if (!response.ok) throw new Error('الدرس غير موجود');

                const lesson = await response.json();
                allLessons = [lesson];
                currentLesson = lesson;

                // عرض الدرس مباشرة (نفس نظام العرض الموجود)
                renderLessonsGrid([lesson]);
                selectLesson(lesson);

                // ✅ Progress: mark as read + Breadcrumb update
                ProgressManager.markAsRead(lesson._id, lesson.sheikhId);
                updateBreadcrumb(lesson);

                // تحديث العنوان
                document.title = `${lesson.title} | منصة زيزو وبلال`;

            } catch (error) {
                console.error('Error loading lesson:', error);
                document.getElementById('lessonsGrid').innerHTML = `
                    <div class="card warning" style="text-align: center; padding: 40px; grid-column: 1 / -1;">
                        <h3>❌ الدرس غير موجود</h3>
                        <p style="color: var(--gray);">قد يكون الدرس محذوفاً أو غير منشور</p>
                        <a href="/website" style="color: var(--gold); text-decoration: underline; margin-top: 15px; display: inline-block;">← العودة لقائمة الدروس</a>
                    </div>
                `;
            }
        }

        function showEmptyState() {
            document.getElementById('lessonsGrid').innerHTML = `
                <div class="card featured" style="text-align: center; padding: 40px; grid-column: 1 / -1;">
                    <h3>🕌 لا توجد دروس منشورة بعد</h3>
                    <p style="color: var(--gray);">أضف دروس من لوحة الأدمن واستخدم التحليل بالذكاء الاصطناعي</p>
                    <a href="/admin" style="color: var(--gold); text-decoration: underline; margin-top: 15px; display: inline-block;">🔧 لوحة الأدمن</a>
                </div>
            `;
        }

        function showErrorState() {
            document.getElementById('lessonsGrid').innerHTML = `
                <div class="card warning" style="text-align: center; padding: 40px; grid-column: 1 / -1;">
                    <h3>❌ خطأ في الاتصال</h3>
                    <p style="color: var(--gray);">تأكد من إعداد MongoDB واتصال الإنترنت</p>
                    <button onclick="location.reload()" style="background: var(--gold); color: var(--black); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 15px;">🔄 إعادة المحاولة</button>
                </div>
            `;
        }

        // ============ 🏗️ Smart Section Resolver — DRY + SSOT + Auto ============
        // 📌 مصدر واحد: name + icon + color في مكان واحد لكل قسم
        const KNOWN_SECTIONS = {

            _cache: {}, // cache للأداء

            // 🎯 الدالة الرئيسية — resolve(lesson, key) → {name, icon, color}
            resolve(lesson, key) {
                const cacheKey = (lesson?._id || '') + ':' + key;
                if (this._cache[cacheKey]) return this._cache[cacheKey];

                const result = {
                    name: this._resolveName(lesson, key),
                    icon: this._resolveIcon(lesson, key),
                    color: this._resolveColor(lesson, key),
                };
                this._cache[cacheKey] = result;
                return result;
            },

            // طبقة 1: JSON._sectionLabels → طبقة 2: KNOWN_SECTIONS → طبقة 3: Auto
            _resolveName(lesson, key) {
                // 1️⃣ من الـ JSON نفسه (مع sanitization)
                const jsonLabel = lesson?._sectionLabels?.[key]?.name;
                if (jsonLabel && typeof jsonLabel === 'string') {
                    return jsonLabel.trim().substring(0, 50);
                }
                // 2️⃣ من القاموس الثابت (fallback للقديم)
                if (KNOWN_SECTIONS[key]?.name) return KNOWN_SECTIONS[key].name;
                // 3️⃣ Auto-format ذكي
                return this._autoFormatName(key);
            },

            _resolveIcon(lesson, key) {
                // 1️⃣ من JSON (سماح emoji فقط)
                const jsonIcon = lesson?._sectionLabels?.[key]?.icon;
                if (jsonIcon && typeof jsonIcon === 'string' && this._isValidIcon(jsonIcon)) {
                    return jsonIcon;
                }
                // 2️⃣ من القاموس → 3️⃣ default
                return KNOWN_SECTIONS[key]?.icon || '✨';
            },

            _resolveColor(lesson, key) {
                // 1️⃣ من JSON (allowlist فقط)
                const jsonColor = lesson?._sectionLabels?.[key]?.color;
                if (jsonColor && ALLOWED_COLORS.includes(jsonColor)) {
                    return jsonColor;
                }
                // 2️⃣ من القاموس → 3️⃣ auto hash
                return KNOWN_SECTIONS[key]?.color || this._autoColor(key);
            },

            // ✨ تحويل camelCase لعنوان مقروء
            _autoFormatName(key) {
                return key
                    .replace(/([A-Z])/g, ' $1')
                    .replace(/^./, c => c.toUpperCase())
                    .trim();
            },

            // 🎨 لون ديناميكي ثابت لكل key (hash-based)
            _autoColor(key) {
                if (!key) return ALLOWED_COLORS[0];
                let hash = 0;
                for (let i = 0; i < key.length; i++) {
                    hash = key.charCodeAt(i) + ((hash << 5) - hash);
                }
                return ALLOWED_COLORS[Math.abs(hash) % ALLOWED_COLORS.length];
            },

            _isValidIcon(icon) {

                if (/^fa-(solid|regular|brands) fa-[a-z0-9-]+$/.test(icon)) return true;
                if (icon.length <= 4 && /[^\x00-\x7F]/.test(icon)) return true;
                return false;

                if (!this._discoveryLog[key]) {

                }
                this._discoveryLog[key].count++;
                if (lessonTitle && !this._discoveryLog[key].lessons.includes(lessonTitle)) {

                }
            },

        // ============ Dynamic Section Renderer (مع الترجمة العربية) ============
        // Sanitize helper for XSS protection
        function sanitize(text) {
            if (typeof DOMPurify !== 'undefined') {
                return DOMPurify.sanitize(String(text));
            }
            // Fallback: basic HTML entity encoding
            return String(text).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        // ترجمة المفتاح الداخلي للعربي (يستخدم SectionResolver)
        function translateKey(key) {
            return SectionResolver.translateSubKey(key);
        }

        // عرض أي قيمة بشكل ذكي (recursive)
        function smartRenderValue(value) {
            if (value === null || value === undefined) return '';
            if (typeof value === 'boolean') return value ? '✅ نعم' : '❌ لا';
            if (typeof value === 'string' || typeof value === 'number') return String(value);
            if (Array.isArray(value)) {
                if (value.length === 0) return '';
                if (typeof value[0] === 'string' || typeof value[0] === 'number') {
                    return '<ul class="styled-list">' + value.map(v => '<li>' + v + '</li>').join('') + '</ul>';
                }
                // Array of objects
                return value.map(item => smartRenderObject(item)).join('');
            }
            if (typeof value === 'object') {
                return smartRenderObject(value);
            }
            return String(value);
        }

        // عرض Object ككارت جميل مع ترجمة المفاتيح (مع لون ديناميكي)
        function smartRenderObject(obj, sectionKey) {
            if (!obj || typeof obj !== 'object') return String(obj || '');

            // استخراج العنوان والمحتوى الرئيسي
            const title = obj.title || obj.name || obj.term || obj.question || obj.mistake || obj.front || '';
            const content = obj.content || obj.description || obj.meaning || obj.definition || obj.explanation
                || obj.answer || obj.correction || obj.back || obj.application || obj.text || '';
            const icon = obj.icon || '';

            // مفاتيح تم استخدامها في العنوان/المحتوى (نتجاهلها في التفاصيل)
            const usedKeys = ['title', 'name', 'term', 'question', 'mistake', 'front',
                'content', 'description', 'meaning', 'definition', 'explanation',
                'answer', 'correction', 'back', 'application', 'text', 'icon'];

            // باقي التفاصيل
            const details = [];
            for (const [k, v] of Object.entries(obj)) {
                if (usedKeys.includes(k)) continue;
                if (v === null || v === undefined || v === '') continue;

                const label = translateKey(k);

                if (Array.isArray(v)) {
                    if (v.length === 0) continue;
                    if (typeof v[0] === 'string' || typeof v[0] === 'number') {
                        details.push('<div class="sub-section"><strong>' + label + ':</strong><ul class="styled-list">' +
                            v.map(item => '<li>' + item + '</li>').join('') + '</ul></div>');
                    } else {
                        details.push('<div class="sub-section"><strong>' + label + ':</strong>' +
                            v.map(item => smartRenderObject(item, sectionKey)).join('') + '</div>');
                    }
                } else if (typeof v === 'object' && v !== null) {
                    details.push('<div class="sub-section"><strong>' + label + ':</strong>' +
                        smartRenderObject(v, sectionKey) + '</div>');
                } else if (typeof v === 'boolean') {
                    details.push('<span class="badge">' + label + ': ' + (v ? '✅ نعم' : '❌ لا') + '</span>');
                } else {
                    details.push('<span class="badge">' + label + ': ' + v + '</span>');
                }
            }

            // الحصول على لون ديناميكي للكارت
            const cardColor = getNextCardColor(sectionKey);

            return '<div class="card color-' + cardColor + '">' +
                (icon ? '<span style="font-size:1.3em;margin-left:8px;">' + icon + '</span>' : '') +
                (title ? '<h4>' + title + '</h4>' : '') +
                (content ? '<p>' + content + '</p>' : '') +
                (details.length ? '<div class="badges" style="margin-top:8px;flex-wrap:wrap;gap:6px;">' + details.join(' ') + '</div>' : '') +
                '</div>';
        }

        function renderDynamicSection(key, data, lesson = null) {
            // 🧠 SectionResolver — 3 طبقات: JSON → KNOWN → Auto
            const info = SectionResolver.resolve(lesson, key);
            const label = info.name;
            const icon = info.icon;

            let contentHtml = '';

            if (Array.isArray(data)) {
                if (data.length === 0) {
                    contentHtml = '<p style="color:#888;">لا يوجد محتوى في هذا القسم</p>';
                } else if (typeof data[0] === 'string' || typeof data[0] === 'number') {
                    // قائمة نصوص بسيطة
                    contentHtml = '<ul class="styled-list">' +
                        data.map(item => '<li>' + item + '</li>').join('') + '</ul>';
                } else {
                    // قائمة Objects → كروت بألوان ديناميكية
                    contentHtml = '<div class="cards-grid">' +
                        data.map(item => smartRenderObject(item, key)).join('') + '</div>';
                }
            } else if (typeof data === 'object' && data !== null) {
                // Object واحد → عرض كل مفتاح بترجمته
                const items = [];
                for (const [k, v] of Object.entries(data)) {
                    if (v === null || v === undefined || v === '') continue;
                    const subLabel = translateKey(k);

                    if (Array.isArray(v)) {
                        if (v.length === 0) continue;
                        if (typeof v[0] === 'string' || typeof v[0] === 'number') {
                            items.push('<div class="card"><h4>' + subLabel + '</h4>' +
                                '<ul class="styled-list">' + v.map(item => '<li>' + item + '</li>').join('') + '</ul></div>');
                        } else {
                            items.push('<div class="card"><h4>' + subLabel + '</h4>' +
                                v.map(item => smartRenderObject(item)).join('') + '</div>');
                        }
                    } else if (typeof v === 'object' && v !== null) {

                            smartRenderObject(v) + '</div>');
                    } else if (typeof v === 'boolean') {

                    } else {
                        items.push('<p><strong>' + subLabel + ':</strong> ' + v + '</p>');
                    }
                }
                contentHtml = items.join('');
            } else {
                // قيمة بسيطة (نص/رقم)
                contentHtml = '<p>' + data + '</p>';
            }

            return '<section id="' + key + '" class="section dynamic-section">' +
                '<h2 class="section-title"><span>' + icon + '</span> ' + label + '</h2>' +
                '<div class="card featured">' + contentHtml + '</div>' +

                    const targetSection = document.getElementById(targetId);

                    if (targetSection) {

                        const targetPosition = targetSection.offsetTop - navHeight - 10;

                        window.scrollTo({
                            top: targetPosition,
                            behavior: 'smooth'
                        });
                    }
                });
            });

            // Scroll tracking
            window.addEventListener('scroll', () => {
                const sections = document.querySelectorAll('.section');
                let current = '';
                const navHeight = document.querySelector('.main-nav')?.offsetHeight || 60;

                sections.forEach(section => {
                    const sectionTop = section.offsetTop - navHeight - 50;
                    if (window.scrollY >= sectionTop) {
                        current = section.getAttribute('id');
                    }
                });

                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + current) {
                        link.classList.add('active');
                    }
                });
            });

        function initSearch() {
            const searchBtn = document.getElementById('searchBtn');
            const searchModal = document.getElementById('searchModal');
            const searchInput = document.getElementById('searchInput');
            const resultsList = document.getElementById('searchResultsList');

            searchBtn.addEventListener('click', () => {
                searchModal.classList.add('active');
                searchInput.focus();
            });

            searchModal.addEventListener('click', (e) => {
                if (e.target === searchModal) closeSearch();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeSearch();
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    searchModal.classList.add('active');
                    searchInput.focus();
                }
            });

            // ═══ Debounced Search Logic ═══
            let timer = null, ctrl = null;
            searchInput.addEventListener('input', function () {
                clearTimeout(timer);
                const q = this.value.trim();
                if (q.length < 2) { resultsList.innerHTML = ''; return; }
                timer = setTimeout(() => doSearch(q), 300);
            });

            async function doSearch(q) {
                if (ctrl) ctrl.abort();
                ctrl = new AbortController();
                resultsList.innerHTML = '<div style="text-align:center;padding:1.5rem;color:rgba(255,255,255,.3);"><i class="fas fa-spinner fa-spin"></i> جاري البحث...</div>';
                try {
                    const res = await fetch(`/api/public/search?q=${encodeURIComponent(q)}`, { signal: ctrl.signal });
                    const data = await res.json();
                    if (!data.results || !data.results.length) {
                        resultsList.innerHTML = '<div style="text-align:center;padding:1.5rem;color:rgba(255,255,255,.3);"><i class="fas fa-search"></i> لا توجد نتائج</div>';
                    } else {
                        resultsList.innerHTML = data.results.map(r => `
                            <div class="search-result-item" onclick="closeSearch(); location.href='/website?lesson=${r._id}'">
                                <div style="color:#DAA520;font-weight:600;margin-bottom:3px;">${r.title}</div>
                                <div style="font-size:.78rem;color:rgba(255,255,255,.4);"><i class="fas fa-user-tie"></i> ${r.sheikhName}</div>
                                ${r.snippet ? `<div style="font-size:.75rem;color:rgba(255,255,255,.25);margin-top:3px;line-height:1.4;">${r.snippet}</div>` : ''}
                            </div>
                        `).join('');
                    }
                } catch (e) {
                    if (e.name !== 'AbortError') { resultsList.innerHTML = '<div style="text-align:center;padding:1rem;color:#ef4444;">خطأ في البحث</div>'; }
                }
            }
        }

        function closeSearch() {
            document.getElementById('searchModal').classList.remove('active');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResultsList').innerHTML = '';
        }

        // ============ 🎨 v3 Enhancements ============

        // Scroll Reveal with fadeInUp (like mixed-version - works on laptop + mobile)
        let revealObserver = null;
        const revealOptions = {
            root: null,
            rootMargin: '0px 0px -50px 0px',
            threshold: 0.05
        };

        revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animation = 'fadeInUp 0.5s ease forwards';
                    revealObserver.unobserve(entry.target);
                }
            });
        }, revealOptions);

        // Don't apply animation to existing cards - they should be visible immediately
        // Animation will only apply to dynamically loaded cards (via addCardActions)

        // Active Section Highlight on Scroll (RTL-aware, dynamic content support)
        window.addEventListener('scroll', () => {
            requestAnimationFrame(() => {
                // Re-query every time to support dynamically loaded content
                const sections = document.querySelectorAll('.section');
                const navLinks = document.querySelectorAll('.nav-link');
                const navContainer = document.getElementById('navContainer');

                let current = '';
                const middleY = window.innerHeight / 2;

                // Find section that contains the middle of the screen
                sections.forEach(section => {
                    if (!section.id) return;
                    const rect = section.getBoundingClientRect();
                    if (rect.top <= middleY && rect.bottom >= middleY) {
                        current = section.id;
                    }
                });

                // Fallback: if no section at middle, use closest to top
                if (!current) {
                    sections.forEach(section => {
                        const top = section.getBoundingClientRect().top;
                        if (top < 200 && section.id) {
                            current = section.id;
                        }
                    });
                }

                if (current && navContainer) {
                    navLinks.forEach(link => {
                        link.classList.remove('active');
                        if (link.getAttribute('href') === '#' + current) {
                            link.classList.add('active');
                            // Center active tab using getBoundingClientRect (RTL-safe)
                            const containerRect = navContainer.getBoundingClientRect();
                            const linkRect = link.getBoundingClientRect();
                            const delta = (linkRect.left + linkRect.width / 2) - (containerRect.left + containerRect.width / 2);
                            navContainer.scrollBy({ left: delta, behavior: 'smooth' });
                        }
                    });
                }
            });
        }, { passive: true });

        // Add share/save/copy buttons to MAIN sections only
        function addCardActions() {
            document.querySelectorAll('.dynamic-section').forEach(section => {
                if (section.querySelector('.card-actions')) return;

                const actions = document.createElement('div');
                actions.className = 'card-actions';
                actions.innerHTML = `

                    </button>
                    <button class="card-action-btn save-btn" onclick="saveCard(this)">
                        <i class="fas fa-bookmark"></i> حفظ
                    </button>
                    <button class="card-action-btn copy-btn" onclick="copyCard(this)">

                `;
                section.appendChild(actions);

        }

        // Share section content with unique link (lesson ID + section ID)
        function shareCard(btn) {
            const section = btn.closest('.section') || btn.closest('.dynamic-section');
            const sectionId = section ? section.id : '';
            const text = section.innerText.replace(/مشاركة|حفظ|نسخ|محفوظ/g, '').trim();

            // بناء رابط فريد: /website?lesson=XXX#section_id
            const shareUrl = window.location.origin + window.location.pathname
                + window.location.search
                + (sectionId ? '#' + sectionId : '');

            // عنوان القسم (أول h2 أو h3)
            const heading = section ? (section.querySelector('h2, h3') || {}).textContent : '';
            const shareTitle = heading ? heading.trim() : 'عِلمٌ يُنتَفَعُ بِه';

            if (navigator.share) {
                navigator.share({
                    title: shareTitle,
                    text: text.substring(0, 200) + '...',
                    url: shareUrl
                }).catch(() => { });
            } else {
                navigator.clipboard.writeText(shareUrl)
                    .then(() => showToast('🔗 تم نسخ رابط القسم'))
                    .catch(() => showToast('❌ فشل النسخ'));
            }
        }

        // Save section (bookmark)
        // === Saved sections storage (localStorage) ===
        function getSavedKey() {
            const params = new URLSearchParams(location.search);
            return 'saved_sections_' + (params.get('lesson') || 'unknown');
        }
        function getSavedSections() {
            try { return JSON.parse(localStorage.getItem(getSavedKey()) || '[]'); }
            catch { return []; }
        }
        function setSavedSections(arr) {
            localStorage.setItem(getSavedKey(), JSON.stringify(arr));
        }

        function saveCard(btn) {
            const saveBtn = btn.closest('.save-btn') || btn;
            const section = saveBtn.closest('.section') || saveBtn.closest('.dynamic-section');
            const sectionId = section ? section.id : '';

            saveBtn.classList.toggle('saved');
            const isSaved = saveBtn.classList.contains('saved');
            saveBtn.innerHTML = isSaved
                ? '<i class="fas fa-heart"></i> محفوظ'
                : '<i class="fas fa-bookmark"></i> حفظ';

            // حفظ/حذف من localStorage
            let saved = getSavedSections();
            if (isSaved && sectionId && !saved.includes(sectionId)) {
                saved.push(sectionId);
            } else if (!isSaved) {
                saved = saved.filter(id => id !== sectionId);
            }
            setSavedSections(saved);

            showToast(isSaved ? '🔖 تم الحفظ' : '❌ تم إلغاء الحفظ');
        }

        // تحميل الحالة المحفوظة عند فتح الصفحة
        function restoreSavedStates() {
            const saved = getSavedSections();
            if (!saved.length) return;
            saved.forEach(sectionId => {
                const section = document.getElementById(sectionId);
                if (!section) return;
                const saveBtn = section.querySelector('.save-btn');
                if (saveBtn && !saveBtn.classList.contains('saved')) {
                    saveBtn.classList.add('saved');
                    saveBtn.innerHTML = '<i class="fas fa-heart"></i> محفوظ';
                }
            });
        }

        // Copy section content
        function copyCard(btn) {
            const section = btn.closest('.dynamic-section');
            const text = section.innerText.replace(/مشاركة|حفظ|نسخ/g, '').trim();
            navigator.clipboard.writeText(text)
                .then(() => showToast('✅ تم النسخ'))
                .catch(() => showToast('❌ فشل النسخ'));
        }

        // Run addCardActions now and also observe for dynamically loaded cards
        addCardActions();
        restoreSavedStates(); // ← استرجاع الأقسام المحفوظة
        const cardObserver = new MutationObserver(() => { addCardActions(); restoreSavedStates(); });
        cardObserver.observe(document.getElementById('lessonContent') || document.body,
            { childList: true, subtree: true });

        // Auto-scroll to section if URL has #hash (from share link)
        if (window.location.hash) {
            setTimeout(() => {
                const target = document.querySelector(window.location.hash);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    // هايلايت خفيف للقسم عشان يلفت الانتباه
                    target.style.transition = 'box-shadow 0.5s ease';
                    target.style.boxShadow = '0 0 20px rgba(237, 186, 38, 0.4)';
                    setTimeout(() => { target.style.boxShadow = ''; }, 3000);
                }
            }, 800); // تأخير عشان المحتوى يكون اتحمل
        }
    </script>
</body>

</html>
