    <script>
        // ============ Configuration ============
        const API_URL = window.location.origin + '/api/public/lessons';

        let currentLesson = null;
        let allLessons = [];

        // ============ Initialize ============
        document.addEventListener('DOMContentLoaded', async function () {
            // قراءة الـ query params من الـ URL
            const params = new URLSearchParams(window.location.search);
            const lessonId = params.get('lesson');
            const sheikhId = params.get('sheikh');
            const categoryId = params.get('category');

            if (lessonId) {
                // عرض درس واحد مباشرة
                await loadSingleLesson(lessonId);
            } else {
                // عرض قائمة دروس (مع فلترة اختيارية)
                const filters = {};
                if (sheikhId) filters.sheikh = sheikhId;
                if (categoryId) filters.category = categoryId;
                await loadLessons(filters);
            }

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 800);

            initScrollTop();
            initSearch();
        });

        // ============ Load Lessons from Public API ============
        async function loadLessons(filters = {}) {
            try {
                // بناء الـ query string من الفلاتر
                const params = new URLSearchParams(filters);
                const url = params.toString() ? `${API_URL}?${params}` : API_URL;

                const response = await fetch(url);
                const data = await response.json();

                // الـ API الجديد بيرجع { lessons: [...], pagination: {...} }
                const lessons = data.lessons || data;
                allLessons = lessons;

                if (lessons.length === 0) {
                    showEmptyState();
                } else {
                    renderLessonsGrid(lessons);
                    // Auto-select first lesson (most recent)
                    selectLessonByIndex(0);
                }
            } catch (error) {
                console.error('Error loading lessons:', error);
                showErrorState();
            }
        }

        // ============ Load Single Lesson by ID ============
        async function loadSingleLesson(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                if (!response.ok) throw new Error('الدرس غير موجود');

                const lesson = await response.json();
                allLessons = [lesson];
                currentLesson = lesson;

                // عرض الدرس مباشرة (نفس نظام العرض الموجود)
                renderLessonsGrid([lesson]);
                selectLesson(lesson);

                // تحديث العنوان
                document.title = `${lesson.title} | منصة زيزو وبلال`;

            } catch (error) {
                console.error('Error loading lesson:', error);
                document.getElementById('lessonsGrid').innerHTML = `
                    <div class="card warning" style="text-align: center; padding: 40px; grid-column: 1 / -1;">
                        <h3>❌ الدرس غير موجود</h3>
                        <p style="color: var(--gray);">قد يكون الدرس محذوفاً أو غير منشور</p>
                        <a href="/website" style="color: var(--gold); text-decoration: underline; margin-top: 15px; display: inline-block;">← العودة لقائمة الدروس</a>
                    </div>
                `;
            }
        }

        function showEmptyState() {
            document.getElementById('lessonsGrid').innerHTML = `
                <div class="card featured" style="text-align: center; padding: 40px; grid-column: 1 / -1;">
                    <h3>🕌 لا توجد دروس منشورة بعد</h3>
                    <p style="color: var(--gray);">أضف دروس من لوحة الأدمن واستخدم التحليل بالذكاء الاصطناعي</p>
                    <a href="/admin" style="color: var(--gold); text-decoration: underline; margin-top: 15px; display: inline-block;">🔧 لوحة الأدمن</a>
                </div>
            `;
        }

        function showErrorState() {
            document.getElementById('lessonsGrid').innerHTML = `

        function renderLessonsGrid(lessons) {
            const grid = document.getElementById('lessonsGrid');
            grid.innerHTML = lessons.map((lesson, index) => `
                <div class="character-card ${['gold', 'blue', 'purple', 'yellow'][index % 4]}" 
                     onclick="selectLessonByIndex(${index})"
                     style="cursor: pointer;" id="lesson-card-${index}">
                    <div class="char-header">
                        <span class="char-icon">📖</span>
                        <div>
                            <h4>${lesson.title}</h4>
                            <span class="char-type">${lesson.subtitle || 'درس إسلامي'}</span>
                        </div>
                    </div>
                    ${lesson.aiAnalyzed ? '<div class="char-lessons"><span>✅ تم التحليل بالذكاء الاصطناعي</span></div>' : ''}
                </div>
            `).join('');
        }

        // ============ Select Lesson by Index ============
        function selectLessonByIndex(index) {
            if (index < 0 || index >= allLessons.length) return;

            const lesson = allLessons[index];
            selectLesson(lesson);

            // Highlight selected card
            document.querySelectorAll('.character-card').forEach((card, i) => {
                card.classList.remove('selected');
                if (i === index) card.classList.add('selected');
            });
        }

        // ============ Select and Render Lesson ============
        function selectLesson(lesson) {
            currentLesson = lesson;
            resetCardColors(); // إعادة تعيين الألوان عند اختيار درس جديد

            // Update header
            document.getElementById('lessonTitle').textContent = lesson.title;
            document.getElementById('lessonSubtitle').textContent = lesson.subtitle || 'درس إسلامي';

            // Update tags
            if (lesson.tags && lesson.tags.length > 0) {
                document.getElementById('lessonTags').innerHTML = lesson.tags.map(tag =>
                    `<span class="tag">${tag}</span>`
                ).join('');
            }

            // Build navigation
            buildNavigation(lesson);

            // Render content
            renderLessonContent(lesson);

            // Scroll to content
            document.getElementById('lessonContent').scrollIntoView({ behavior: 'smooth' });
        }

        function buildNavigation(lesson) {
            const nav = document.getElementById('navContainer');
            const sections = [];

            // Known sections to skip when detecting dynamic ones
            const knownKeys = ['title', 'subtitle', 'tags', 'rawContent', 'rawSource', 'status', 'aiAnalyzed',
                'overview', 'podcast', 'characters', 'quranHadith', 'fiqh',
                'questions', 'benefits', 'stories', 'analysis', '_id', 'createdAt', 'updatedAt', '__v',
                // Metadata fields
                'sheikhId', 'categoryId', 'selectedCategoryId', 'sectionId',
                // Enriched fields from Public API
                'sheikhName', 'sheikhImage', 'categoryName', 'categoryIcon', 'categoryColor'];

            // Check available known sections
            sections.push({ id: 'lessons', icon: '📚', name: 'الدروس' });

            if (lesson.overview?.message || lesson.overview?.points?.length) {
                sections.push({ id: 'overview', icon: '📋', name: 'نظرة عامة' });
            }
            if (lesson.podcast?.length) {
                sections.push({ id: 'podcast', icon: '🎙️', name: 'البودكاست' });
            }
            if (lesson.characters?.length) {
                sections.push({ id: 'characters', icon: '👥', name: 'الشخصيات' });
            }
            if (lesson.quranHadith?.ayat?.length || lesson.quranHadith?.hadith?.length || lesson.quranHadith?.duaa?.length) {
                sections.push({ id: 'quran', icon: '📖', name: 'الآيات والأحاديث' });
            }
            if (lesson.fiqh?.rewards?.length || lesson.fiqh?.sunan?.length || lesson.fiqh?.warnings?.length || lesson.fiqh?.qa?.length) {
                sections.push({ id: 'fiqh', icon: '🕌', name: 'الأحكام' });
            }
            if (lesson.questions?.trueFalse?.length) {
                sections.push({ id: 'questions', icon: '❓', name: 'الأسئلة' });
            }
            if (lesson.benefits?.length) {
                sections.push({ id: 'benefits', icon: '💎', name: 'الفوائد' });
            }
            if (lesson.stories?.length) {
                sections.push({ id: 'stories', icon: '📚', name: 'القصص' });
            }
            if (lesson.analysis?.map?.length || lesson.analysis?.actionPlan || lesson.analysis?.conclusion) {
                sections.push({ id: 'analysis', icon: '🔍', name: 'التحليل' });
            }

            // Add dynamic/custom sections to navigation (مع الترجمة العربية)
            for (const [key, value] of Object.entries(lesson)) {
                if (knownKeys.includes(key)) continue;
                if (value === null || value === undefined) continue;
                if (Array.isArray(value) && value.length === 0) continue;
                if (typeof value === 'object' && Object.keys(value).length === 0) continue;

                // استخدام القاموس العربي + أيقونة افتراضية لو مش موجود
                const sectionInfo = SECTION_LABELS[key];
                const label = sectionInfo ? sectionInfo.name : key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
                const icon = sectionInfo ? sectionInfo.icon : '✨';
                if (!sectionInfo) console.warn(`⚠️ قسم جديد مش في القاموس: "${key}" - ضيفه في SECTION_LABELS`);
                sections.push({ id: key, icon: icon, name: label });
            }

            nav.innerHTML = sections.map((s, i) => `
                <a href="#${s.id}" class="nav-link ${i === 0 ? 'active' : ''}">
                    <span class="nav-icon">${s.icon}</span>
                    <span class="nav-text">${s.name}</span>
                </a>
            `).join('');

            initNavigation();
        }

            if (lesson.overview?.message || lesson.overview?.points?.length) {

                html += renderPodcast(lesson.podcast);
            }

            // Characters Section

                html += renderCharacters(lesson.characters);

        // ============ Dynamic Section Renderer (مع الترجمة العربية) ============
        // Sanitize helper for XSS protection
        function sanitize(text) {
            if (typeof DOMPurify !== 'undefined') {
                return DOMPurify.sanitize(String(text));
            }
            // Fallback: basic HTML entity encoding
            return String(text).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        // ترجمة المفتاح الداخلي للعربي
        function translateKey(key) {
            return SUB_KEY_LABELS[key] || key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
        }

        // عرض أي قيمة بشكل ذكي (recursive)
        function smartRenderValue(value) {
            if (value === null || value === undefined) return '';
            if (typeof value === 'boolean') return value ? '✅ نعم' : '❌ لا';
            if (typeof value === 'string' || typeof value === 'number') return String(value);
            if (Array.isArray(value)) {
                if (value.length === 0) return '';
                if (typeof value[0] === 'string' || typeof value[0] === 'number') {
                    return '<ul class="styled-list">' + value.map(v => '<li>' + v + '</li>').join('') + '</ul>';
                }
                // Array of objects
                return value.map(item => smartRenderObject(item)).join('');
            }
            if (typeof value === 'object') {
                return smartRenderObject(value);
            }
            return String(value);
        }

        // عرض Object ككارت جميل مع ترجمة المفاتيح (مع لون ديناميكي)
        function smartRenderObject(obj, sectionKey) {
            if (!obj || typeof obj !== 'object') return String(obj || '');

            // استخراج العنوان والمحتوى الرئيسي
            const title = obj.title || obj.name || obj.term || obj.question || obj.mistake || obj.front || '';
            const content = obj.content || obj.description || obj.meaning || obj.definition || obj.explanation
                || obj.answer || obj.correction || obj.back || obj.application || obj.text || '';
            const icon = obj.icon || '';

            // مفاتيح تم استخدامها في العنوان/المحتوى (نتجاهلها في التفاصيل)
            const usedKeys = ['title', 'name', 'term', 'question', 'mistake', 'front',
                'content', 'description', 'meaning', 'definition', 'explanation',
                'answer', 'correction', 'back', 'application', 'text', 'icon'];

            // باقي التفاصيل
            const details = [];
            for (const [k, v] of Object.entries(obj)) {
                if (usedKeys.includes(k)) continue;
                if (v === null || v === undefined || v === '') continue;

                const label = translateKey(k);

                if (Array.isArray(v)) {
                    if (v.length === 0) continue;
                    if (typeof v[0] === 'string' || typeof v[0] === 'number') {
                        details.push('<div class="sub-section"><strong>' + label + ':</strong><ul class="styled-list">' +
                            v.map(item => '<li>' + item + '</li>').join('') + '</ul></div>');
                    } else {
                        details.push('<div class="sub-section"><strong>' + label + ':</strong>' +
                            v.map(item => smartRenderObject(item, sectionKey)).join('') + '</div>');
                    }
                } else if (typeof v === 'object' && v !== null) {
                    details.push('<div class="sub-section"><strong>' + label + ':</strong>' +
                        smartRenderObject(v, sectionKey) + '</div>');
                } else if (typeof v === 'boolean') {
                    details.push('<span class="badge">' + label + ': ' + (v ? '✅ نعم' : '❌ لا') + '</span>');
                } else {
                    details.push('<span class="badge">' + label + ': ' + v + '</span>');
                }
            }

            // الحصول على لون ديناميكي للكارت
            const cardColor = getNextCardColor(sectionKey);

            return '<div class="card color-' + cardColor + '">' +
                (icon ? '<span style="font-size:1.3em;margin-left:8px;">' + icon + '</span>' : '') +
                (title ? '<h4>' + title + '</h4>' : '') +
                (content ? '<p>' + content + '</p>' : '') +
                (details.length ? '<div class="badges" style="margin-top:8px;flex-wrap:wrap;gap:6px;">' + details.join(' ') + '</div>' : '') +
                '</div>';
        }

        function renderDynamicSection(key, data) {
            // استخدام القاموس العربي للعنوان والأيقونة
            const sectionInfo = SECTION_LABELS[key];
            const label = sectionInfo ? sectionInfo.name : key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
            const icon = sectionInfo ? sectionInfo.icon : '✨';

            let contentHtml = '';

            if (Array.isArray(data)) {
                if (data.length === 0) {
                    contentHtml = '<p style="color:#888;">لا يوجد محتوى في هذا القسم</p>';
                } else if (typeof data[0] === 'string' || typeof data[0] === 'number') {
                    // قائمة نصوص بسيطة
                    contentHtml = '<ul class="styled-list">' +
                        data.map(item => '<li>' + item + '</li>').join('') + '</ul>';
                } else {
                    // قائمة Objects → كروت بألوان ديناميكية
                    contentHtml = '<div class="cards-grid">' +
                        data.map(item => smartRenderObject(item, key)).join('') + '</div>';
                }
            } else if (typeof data === 'object' && data !== null) {
                // Object واحد → عرض كل مفتاح بترجمته
                const items = [];
                for (const [k, v] of Object.entries(data)) {
                    if (v === null || v === undefined || v === '') continue;
                    const subLabel = translateKey(k);

                    if (Array.isArray(v)) {
                        if (v.length === 0) continue;
                        if (typeof v[0] === 'string' || typeof v[0] === 'number') {
                            items.push('<div class="card"><h4>' + subLabel + '</h4>' +
                                '<ul class="styled-list">' + v.map(item => '<li>' + item + '</li>').join('') + '</ul></div>');
                        } else {
                            items.push('<div class="card"><h4>' + subLabel + '</h4>' +
                                v.map(item => smartRenderObject(item)).join('') + '</div>');
                        }
                    } else if (typeof v === 'object' && v !== null) {
                        items.push('<div class="card"><h4>' + subLabel + '</h4>' +
                            smartRenderObject(v) + '</div>');
                    } else if (typeof v === 'boolean') {
                        items.push('<p><strong>' + subLabel + ':</strong> ' + (v ? '✅ نعم' : '❌ لا') + '</p>');
                    } else {
                        items.push('<p><strong>' + subLabel + ':</strong> ' + v + '</p>');
                    }
                }
                contentHtml = items.join('');
            } else {
                // قيمة بسيطة (نص/رقم)
                contentHtml = '<p>' + data + '</p>';
            }

            return '<section id="' + key + '" class="section dynamic-section">' +
                '<h2 class="section-title"><span>' + icon + '</span> ' + label + '</h2>' +
                '<div class="card featured">' + contentHtml + '</div>' +
                '</section>';
        }

        // ============ Navigation ============
        function initNavigation() {
            const navLinks = document.querySelectorAll('.nav-link');

            navLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();

                    navLinks.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');

                    const targetId = this.getAttribute('href').substring(1);
                    const targetSection = document.getElementById(targetId);

                    if (targetSection) {
                        const navHeight = document.querySelector('.main-nav').offsetHeight;
                        const targetPosition = targetSection.offsetTop - navHeight - 10;

                        window.scrollTo({
                            top: targetPosition,
                            behavior: 'smooth'
                        });
                    }
                });
            });

            // Scroll tracking
            window.addEventListener('scroll', () => {
                const sections = document.querySelectorAll('.section');
                let current = '';
                const navHeight = document.querySelector('.main-nav')?.offsetHeight || 60;

                sections.forEach(section => {
                    const sectionTop = section.offsetTop - navHeight - 50;
                    if (window.scrollY >= sectionTop) {
                        current = section.getAttribute('id');
                    }
                });

                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === '#' + current) {
                        link.classList.add('active');
                    }
                });
            });
        }

        // ============ Utilities ============
        function copyText(element) {
            const text = element.querySelector('.ayah-text, .hadith-text, .dua-text')?.textContent || element.textContent;
            navigator.clipboard.writeText(text.trim()).then(() => {
                showToast('تم النسخ بنجاح! 📋');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function initScrollTop() {
            const scrollTopBtn = document.getElementById('scrollTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 500) {
                    scrollTopBtn.classList.add('visible');
                } else {
                    scrollTopBtn.classList.remove('visible');
                }
            });

            scrollTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function initSearch() {
            const searchBtn = document.getElementById('searchBtn');
            const searchModal = document.getElementById('searchModal');
            const searchInput = document.getElementById('searchInput');

            searchBtn.addEventListener('click', () => {
                searchModal.classList.add('active');
                searchInput.focus();
            });

            searchModal.addEventListener('click', (e) => {
                if (e.target === searchModal) closeSearch();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeSearch();
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    searchModal.classList.add('active');
                    searchInput.focus();
                }
            });
        }

        function closeSearch() {
            document.getElementById('searchModal').classList.remove('active');
            document.getElementById('searchInput').value = '';
        }

        // ============ 🎨 v3 Enhancements ============

        // Scroll Reveal with fadeInUp (like mixed-version - works on laptop + mobile)
        let revealObserver = null;
        const revealOptions = {
            root: null,
            rootMargin: '0px 0px -50px 0px',
            threshold: 0.05
        };

        revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animation = 'fadeInUp 0.5s ease forwards';
                    revealObserver.unobserve(entry.target);
                }
            });
        }, revealOptions);

        // Don't apply animation to existing cards - they should be visible immediately
        // Animation will only apply to dynamically loaded cards (via addCardActions)

        // Active Section Highlight on Scroll (RTL-aware, dynamic content support)
        window.addEventListener('scroll', () => {
            requestAnimationFrame(() => {
                // Re-query every time to support dynamically loaded content
                const sections = document.querySelectorAll('.section');
                const navLinks = document.querySelectorAll('.nav-link');
                const navContainer = document.getElementById('navContainer');

                let current = '';
                const middleY = window.innerHeight / 2;

                // Find section that contains the middle of the screen
                sections.forEach(section => {
                    if (!section.id) return;
                    const rect = section.getBoundingClientRect();
                    if (rect.top <= middleY && rect.bottom >= middleY) {
                        current = section.id;
                    }
                });

                // Fallback: if no section at middle, use closest to top
                if (!current) {
                    sections.forEach(section => {
                        const top = section.getBoundingClientRect().top;
                        if (top < 200 && section.id) {
                            current = section.id;
                        }
                    });
                }

                if (current && navContainer) {
                    navLinks.forEach(link => {
                        link.classList.remove('active');
                        if (link.getAttribute('href') === '#' + current) {
                            link.classList.add('active');
                            // Center active tab using getBoundingClientRect (RTL-safe)
                            const containerRect = navContainer.getBoundingClientRect();
                            const linkRect = link.getBoundingClientRect();
                            const delta = (linkRect.left + linkRect.width / 2) - (containerRect.left + containerRect.width / 2);
                            navContainer.scrollBy({ left: delta, behavior: 'smooth' });
                        }
                    });
                }
            });
        }, { passive: true });

        // ============ 📤 Share / Save / Copy Buttons ============

        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Add share/save/copy buttons to MAIN sections only
        function addCardActions() {
            document.querySelectorAll('.dynamic-section').forEach(section => {
                if (section.querySelector('.card-actions')) return;

                const actions = document.createElement('div');
                actions.className = 'card-actions';
                actions.innerHTML = `
                    <button class="card-action-btn share-btn" onclick="shareCard(this)">
                        <i class="fas fa-share-alt"></i> مشاركة
                    </button>
                    <button class="card-action-btn save-btn" onclick="saveCard(this)">
                        <i class="fas fa-bookmark"></i> حفظ
                    </button>
                    <button class="card-action-btn copy-btn" onclick="copyCard(this)">
                        <i class="fas fa-copy"></i> نسخ
                    </button>
                `;
                section.appendChild(actions);
            });
            // Dynamic cards are now visible immediately - no animation hiding
        }

        // Share section content
        function shareCard(btn) {
            const section = btn.closest('.dynamic-section');
            const text = section.innerText.replace(/مشاركة|حفظ|نسخ/g, '').trim();

            if (navigator.share) {
                navigator.share({ title: 'عِلمٌ يُنتَفَعُ بِه', text: text.substring(0, 300) })
                    .catch(() => { });
            } else {
                navigator.clipboard.writeText(text.substring(0, 500))
                    .then(() => showToast('✅ تم النسخ للمشاركة'))
                    .catch(() => showToast('❌ فشل النسخ'));
            }
        }

        // Save section (bookmark)
        function saveCard(btn) {
            const saveBtn = btn.closest('.save-btn') || btn;
            saveBtn.classList.toggle('saved');
            const isSaved = saveBtn.classList.contains('saved');
            saveBtn.innerHTML = isSaved
                ? '<i class="fas fa-heart"></i> محفوظ'
                : '<i class="fas fa-bookmark"></i> حفظ';
            showToast(isSaved ? '🔖 تم الحفظ' : '❌ تم إلغاء الحفظ');
        }

        // Copy section content
        function copyCard(btn) {
            const section = btn.closest('.dynamic-section');
            const text = section.innerText.replace(/مشاركة|حفظ|نسخ/g, '').trim();
            navigator.clipboard.writeText(text)
                .then(() => showToast('✅ تم النسخ'))
                .catch(() => showToast('❌ فشل النسخ'));
        }

        // Run addCardActions now and also observe for dynamically loaded cards
        addCardActions();
        const cardObserver = new MutationObserver(() => addCardActions());
        cardObserver.observe(document.getElementById('lessonContent') || document.body,
            { childList: true, subtree: true });
    </script>
</body>

</html>
